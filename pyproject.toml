[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-control"
version = "0.1.0"
description = "Negative control for pull requests: run the PR's tests against base AND head, and diff the suites."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["pytest>=7"]

[project.scripts]
pr-control = "prcontrol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
